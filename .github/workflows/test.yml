name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Lua 5.1 and LuaJIT
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - run: lua5.1 tests/run.lua
      - run: lua5.1 tests/ui.lua
      - run: luajit tests/run.lua
      - run: luajit tests/ui.lua
      - run: LUA=lua5.1 python3 scripts/verify.py
      - name: Determine addon release version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          version = re.search(r'^## Version: (\S+)$', Path('InCharacter/InCharacter.toc').read_text(), re.M).group(1)
          ref = os.environ['GITHUB_REF']
          tagged = ref.startswith('refs/tags/v')
          if tagged:
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and addon version differ'
          previous = subprocess.run(['git', 'show', 'HEAD^:InCharacter/InCharacter.toc'], capture_output=True, text=True)
          old = re.search(r'^## Version: (\S+)$', previous.stdout, re.M)
          bumped = old is None or old.group(1) != version
          main = ref == 'refs/heads/' + os.environ['DEFAULT_BRANCH']
          publish = os.environ['GITHUB_EVENT_NAME'] == 'push' and (tagged or (main and bumped))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version=v{version}\npublish={str(publish).lower()}\n')
          PY
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: InCharacter-addon
          path: dist/InCharacter-*.zip
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && needs.test.outputs.publish == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InCharacter-addon
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/InCharacter-*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
