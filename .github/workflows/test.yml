name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and LuaJIT
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - name: Logic tests (Lua 5.1)
        run: lua5.1 tests/run.lua
      - name: UI tests (Lua 5.1)
        run: lua5.1 tests/ui.lua
      - name: Logic tests (LuaJIT)
        run: luajit tests/run.lua
      - name: UI tests (LuaJIT)
        run: luajit tests/ui.lua
      - name: Verify manifests, bindings and Lua syntax
        run: LUA=lua5.1 python3 scripts/verify.py
      - name: Check release tag matches addon version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = re.search(r'^## Version: (\S+)$', Path('InCharacter/InCharacter.toc').read_text(), re.M).group(1)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and addon version differ'
          PY
      - name: Package addon
        run: python3 scripts/package.py
      - name: Render model geometry
        run: lua5.1 scripts/layout_preview.lua > dist/InCharacter-layout.svg
      - uses: actions/upload-artifact@v4
        with:
          name: InCharacter-addon
          path: |
            dist/InCharacter-*.zip
            dist/InCharacter-layout.svg
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InCharacter-addon
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/InCharacter-*.zip
            dist/InCharacter-layout.svg
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
