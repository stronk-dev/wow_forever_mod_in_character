name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Lua 5.1 and LuaJIT
        run: sudo apt-get update && sudo apt-get install -y lua5.1 luajit
      - run: lua5.1 tests/run.lua
      - run: lua5.1 tests/ui.lua
      - run: luajit tests/run.lua
      - run: luajit tests/ui.lua
      - run: LUA=lua5.1 python3 scripts/verify.py
      - name: Determine addon release version
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          version = re.search(r'^## Version: (\S+)$', Path('InCharacter/InCharacter.toc').read_text(), re.M).group(1)
          ref = os.environ['GITHUB_REF']
          tagged = ref.startswith('refs/tags/v')
          if tagged:
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and addon version differ'
          previous = subprocess.run(['git', 'show', 'HEAD^:InCharacter/InCharacter.toc'], capture_output=True, text=True)
          old = re.search(r'^## Version: (\S+)$', previous.stdout, re.M)
          bumped = old is None or old.group(1) != version
          main = ref == 'refs/heads/' + os.environ['DEFAULT_BRANCH']
          publish = os.environ['GITHUB_EVENT_NAME'] == 'push' and (tagged or (main and bumped))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version=v{version}\npublish={str(publish).lower()}\n')
          PY
      - run: python3 scripts/package.py
      - name: Render model geometry
        run: lua5.1 scripts/layout_preview.lua > dist/InCharacter-layout.svg
      - uses: actions/upload-artifact@v4
        with:
          name: InCharacter-addon
          path: |
            dist/InCharacter-*.zip
            dist/InCharacter-layout.svg
          if-no-files-found: error
  release:
    if: github.event_name == 'push' && needs.test.outputs.publish == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: incharacter-release-${{ needs.test.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InCharacter-addon
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/InCharacter-*.zip
            dist/InCharacter-layout.svg
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
      # Tagged builds also go to CurseForge as Release files, so addon managers update them.
      # Skipped until the repository has the CF_API_TOKEN secret and the CURSEFORGE_PROJECT_ID variable.
      - name: Upload to CurseForge
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          VERSION: ${{ needs.test.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::notice::CurseForge upload skipped: CF_API_TOKEN secret or CURSEFORGE_PROJECT_ID variable not set"
            exit 0
          fi
          zip="dist/InCharacter-${VERSION#v}.zip"
          test -f "$zip"
          curl -fsS -H "X-Api-Token: $CF_API_TOKEN" https://wow.curseforge.com/api/game/versions -o versions.json
          # WoW Forever is game version 1.60.1 (interface 16001) on CurseForge.
          python3 - "$VERSION" "$REPO" > metadata.json <<'PY'
          import json, sys
          version, repo = sys.argv[1], sys.argv[2]
          ids = [v["id"] for v in json.load(open("versions.json")) if v.get("name") == "1.60.1"]
          assert len(ids) == 1, f"expected one CurseForge game version named 1.60.1, found {ids}"
          print(json.dumps({
              "displayName": f"In Character {version}",
              "gameVersions": ids,
              "releaseType": "release",
              "changelogType": "markdown",
              "changelog": f"See the [GitHub release](https://github.com/{repo}/releases/tag/{version}).",
          }))
          PY
          curl -fsS -H "X-Api-Token: $CF_API_TOKEN" \
            -F "metadata=<metadata.json" -F "file=@$zip" \
            "https://wow.curseforge.com/api/projects/$PROJECT_ID/upload-file"
